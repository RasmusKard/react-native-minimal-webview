# Anti-slop profile: REPLACES the default rule set (do not use --build-upon-default-config).
# Baseline: .claude/baseline/detekt.xml
config:
  validation: true
  warningsAsErrors: false
processors:
  active: false
console-reports:
  active: true
complexity:
  CyclomaticComplexMethod: { active: true, threshold: 15, ignoreSimpleWhenEntries: true }
  CognitiveComplexMethod: { active: true, threshold: 15 }
  NestedBlockDepth: { active: true, threshold: 4 }          # 4 == report depth >= 4 (i.e. >3 nested levels)
  LongMethod: { active: true, threshold: 120 }
  LongParameterList: { active: true, functionThreshold: 6, constructorThreshold: 8, ignoreDefaultParameters: true }
empty-blocks:
  EmptyCatchBlock: { active: true, allowedExceptionNameRegex: '^$' }
  EmptyFunctionBlock: { active: true, ignoreOverridden: true }
  EmptyClassBlock: { active: true }
  EmptyIfBlock: { active: true }
  EmptyElseBlock: { active: true }
  EmptyForBlock: { active: true }
  EmptyWhileBlock: { active: true }
  EmptyWhenBlock: { active: true }
  EmptyTryBlock: { active: true }
  EmptyFinallyBlock: { active: true }
  EmptyInitBlock: { active: true }
  EmptyKtFile: { active: true }
exceptions:
  SwallowedException: { active: true }
  NotImplementedDeclaration: { active: true }
  PrintStackTrace: { active: true }
  RethrowCaughtException: { active: true }
  ThrowingExceptionsWithoutMessageOrCause: { active: true }
  TooGenericExceptionCaught: { active: true }
  ExceptionRaisedInUnexpectedLocation: { active: true }
style:
  ForbiddenComment: { active: true, comments: ['TODO:', 'FIXME:', 'STOPSHIP:', 'HACK:'] }
  ForbiddenSuppress: { active: true, rules: [] }
  UnusedImports: { active: true }
  UnusedPrivateMember: { active: true }
  UnusedPrivateProperty: { active: true }
  UnusedParameter: { active: true }
  UnusedPrivateClass: { active: true }
  UseCheckOrError: { active: true }
  UseRequire: { active: true }
  FunctionOnlyReturningConstant: { active: true }
