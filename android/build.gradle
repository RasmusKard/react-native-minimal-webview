plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.minimalwebview'
version = '0.1.0' // expo-autolinking requires it

android {
  namespace "expo.modules.minimalwebview"
  defaultConfig {
    minSdkVersion 29
    versionName project.version // Expo SDK 53's module plugin requires it
    consumerProguardFiles 'consumer-rules.pro'
  }
  // -PmrwCoverage: JaCoCo for the unit tests (docs/development.md); without it, the build is unchanged
  if (providers.gradleProperty('mrwCoverage').present) buildTypes.debug.enableUnitTestCoverage = true
}

dependencies {
  implementation 'androidx.webkit:webkit:1.17.1'
  implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0' // pullToRefresh
  implementation 'androidx.activity:activity:1.8.0' // fullscreenVideo: back press exits fullscreen
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517' // the real org.json; Android's is a stub in JVM tests
}
