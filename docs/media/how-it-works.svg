<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270" role="img" aria-labelledby="title desc">
  <title id="title">How react-native-minimal-webview works</title>
  <desc id="desc">The app passes rules and settings to the native WebView core and gets state and events back. The core decides each navigation the page makes without asking JS. The bridge carries promise calls and events between the app and pages on allowed origins.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 17px; font-weight: 600; }
    .sub { font-size: 13px; fill: #59636e; }
    .item { font-size: 15px; }
    .label { font-size: 13px; fill: #59636e; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .core { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
    .arrow { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .bridge { stroke: #0969da; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    .bridge-label { font-size: 14px; fill: #0969da; }
    .head { fill: #59636e; }
    .bridge-head { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub, .label { fill: #9198a1; }
      .box { fill: #151b23; stroke: #3d444d; }
      .core { fill: #0c2d6b; stroke: #1f6feb; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .bridge { stroke: #4493f8; }
      .bridge-label { fill: #4493f8; }
      .bridge-head { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="bridge-head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="20" width="180" height="170" rx="8"/>
  <text class="title" x="100" y="50" text-anchor="middle">Your app</text>
  <text class="sub" x="100" y="68" text-anchor="middle">React Native, JS</text>
  <text class="item" x="100" y="104" text-anchor="middle">WebView props</text>
  <text class="item" x="100" y="128" text-anchor="middle">useWebViewState</text>
  <text class="item" x="100" y="152" text-anchor="middle">bridge methods</text>

  <rect class="core" x="300" y="20" width="180" height="170" rx="8"/>
  <text class="title" x="390" y="50" text-anchor="middle">WebView core</text>
  <text class="sub" x="390" y="68" text-anchor="middle">Swift, Kotlin</text>
  <text class="item" x="390" y="104" text-anchor="middle">navigation rules</text>
  <text class="item" x="390" y="128" text-anchor="middle">platform settings</text>
  <text class="item" x="390" y="152" text-anchor="middle">your native hooks</text>

  <rect class="box" x="590" y="20" width="180" height="170" rx="8"/>
  <text class="title" x="680" y="50" text-anchor="middle">Web page</text>
  <text class="sub" x="680" y="68" text-anchor="middle">any site</text>
  <text class="item" x="680" y="104" text-anchor="middle">links, redirects</text>
  <text class="item" x="680" y="128" text-anchor="middle">new windows</text>
  <text class="item" x="680" y="152" text-anchor="middle">file and camera asks</text>

  <text class="label" x="245" y="88" text-anchor="middle">rules, settings</text>
  <line class="arrow" x1="196" y1="98" x2="294" y2="98" marker-end="url(#h)"/>
  <line class="arrow" x1="294" y1="138" x2="196" y2="138" marker-end="url(#h)"/>
  <text class="label" x="245" y="158" text-anchor="middle">state, events</text>

  <text class="label" x="535" y="88" text-anchor="middle">navigations</text>
  <line class="arrow" x1="584" y1="98" x2="486" y2="98" marker-end="url(#h)"/>
  <line class="arrow" x1="486" y1="138" x2="584" y2="138" marker-end="url(#h)"/>
  <text class="label" x="535" y="158" text-anchor="middle">allow or block</text>

  <path class="bridge" d="M100 196V226H680V196" marker-start="url(#hb)" marker-end="url(#hb)"/>
  <text class="bridge-label" x="390" y="250" text-anchor="middle">bridge: promise calls and events, only with the origins you allow</text>
</svg>
