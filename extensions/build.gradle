plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.minimalwebviewextensions'
version = '0.1.0' // expo-module-gradle-plugin requires it

layout.buildDirectory = file('build/gradle')

android {
  namespace "expo.modules.minimalwebviewextensions"
  defaultConfig {
    minSdkVersion 29
    versionName project.version // Expo SDK 53's module plugin requires it
    consumerProguardFiles 'consumer-rules.pro'
  }
  sourceSets {
    main {
      java.srcDirs = ['src', 'basicAuthCredential', 'dialogs', 'googleMobileAds', 'incognito', 'menuItems', 'onScroll', 'transparentBackground', 'nestedScrollEnabled', 'androidLayerType', 'downloadManager', 'onLoadSubResourceError']
    }
  }
}

dependencies {
  implementation project(':react-native-minimal-webview')
}
