plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.sampleextension'
version = '0.0.1'

android {
  namespace "expo.modules.sampleextension"
  defaultConfig {
    minSdkVersion 29
  }
}

dependencies {
  implementation project(':react-native-minimal-webview')
}
