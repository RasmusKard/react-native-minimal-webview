<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Device APIs</title>
<script src="/common.js"></script>
<style>body{font:16px system-ui;margin:12px}a,button,input{display:block;margin:10px 0;font-size:16px}</style>
<h1>Device APIs</h1>
<button id="camera" onclick="navigator.mediaDevices.getUserMedia({ video: true }).then((s) => { log('camera ok', s.getTracks().length); s.getTracks().forEach((t) => t.stop()); }, (e) => log('camera error', e.name))">getUserMedia video</button>
<button id="mic" onclick="navigator.mediaDevices.getUserMedia({ audio: true }).then((s) => { log('mic ok'); s.getTracks().forEach((t) => t.stop()); }, (e) => log('mic error', e.name))">getUserMedia audio</button>
<button id="geo" onclick="navigator.geolocation.getCurrentPosition((p) => log('geo ok', p.coords.latitude, p.coords.longitude), (e) => log('geo error', e.code, e.message), { timeout: 5000, maximumAge: 60000 })">geolocation</button>
<script>
  // In a frame (?auto=camera): asks at once and tells the parent, which logs it.
  if (location.search.includes('auto=camera')) {
    Promise.resolve().then(() => navigator.mediaDevices.getUserMedia({ video: true })).then(
      (s) => { parent.postMessage('frame camera ok', '*'); s.getTracks().forEach((t) => t.stop()); },
      (e) => parent.postMessage('frame camera error ' + e.name, '*')
    );
  }
  addEventListener('message', (event) => log(event.data));
</script>
