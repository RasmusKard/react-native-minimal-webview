<!doctype html>

<title>Injection</title>
<script src="/common.js"></script>
<style>body{font:16px system-ui;margin:12px}a,button,input{display:block;margin:10px 0;font-size:16px}</style>
<h1>Injection</h1>
<p>script ran before page scripts: <b id="start"></b></p>
<p>its DOMContentLoaded listener ran: <b id="end"></b></p>
<script>
  document.getElementById('start').textContent = String(window.__injectedStart === true);
  addEventListener('load', () => {
    document.getElementById('end').textContent = String(window.__injectedEnd === true);
  });
</script>
