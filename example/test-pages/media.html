<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Media, uploads, downloads</title>
<script src="/common.js"></script>
<style>body{font:16px system-ui;margin:12px}a,button,input{display:block;margin:10px 0;font-size:16px}</style>
<h1>Media, uploads, downloads</h1>
<label>any file <input id="file" type="file" onchange="log('picked', [...this.files].map((f) => f.name + ':' + f.size))" /></label>
<label>images, multiple <input id="images" type="file" accept="image/*" multiple onchange="log('picked', [...this.files].map((f) => f.name + ':' + f.size))" /></label>
<label>camera capture <input id="capture" type="file" accept="image/*" capture="environment" onchange="log('picked', [...this.files].map((f) => f.name + ':' + f.size))" /></label>
<div id="fs" style="background:#036;color:#fff;padding:8px">fullscreen target</div>
<button id="fullscreen" onclick="document.getElementById('fs').requestFullscreen().then(() => log('fullscreen on'), (e) => log('fullscreen error', e.name))">go fullscreen</button>
<a id="attachment" href="/download?name=report.txt">attachment download</a>
<a id="blob" download="blob.txt">blob: download</a>
<script>
  document.getElementById('blob').href = URL.createObjectURL(new Blob(['blob body'], { type: 'text/plain' }));
</script>
<a id="moved">moved attachment</a>
<script>
  document.getElementById('moved').href = '/moved?key=' + Date.now();
</script>
<a id="baddata" href="data:text/plain;base64,@@@not-base64@@@" download="bad.txt">invalid data: download</a>
<a id="data" href="data:text/plain,data%20body" download="data.txt">data: download</a>
