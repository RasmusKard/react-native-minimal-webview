appId: expo.modules.minimalwebview.example
name: ${SUITE}
# Runs one suite (-e SUITE=<name>): starts it, then does on the device what the suite asks (`DriverAction` in
# harness/runner.ts), one request at a time, until its verdict. The test server's log has the checks.
---
# Reuses the running app when the test server's /harness/idle answers yes (the harness resets itself after each suite);
# otherwise launches it fresh.
- runScript: scripts/idle.js
- runFlow:
    when: { true: '${output.launch}' }
    commands:
      - launchApp: { stopApp: true, permissions: { all: allow } }
- runScript: scripts/start.js
- repeat:
    while: { true: "${output.action != 'done'}" }
    commands:
      - runScript: scripts/next.js
      - runFlow:
          when: { true: "${output.action == 'tap' || output.action == 'tapThenBack'}" }
          commands:
            - tapOn: { point: '${output.point}', waitToSettleTimeoutMs: 200 }
      # What the tap opened covers the app (the system file chooser); back closes it.
      - runFlow:
          when: { true: "${output.action == 'tapThenBack'}" }
          commands:
            - extendedWaitUntil: { notVisible: { id: harness-request }, timeout: 10000 }
            - back
      - runFlow:
          when: { true: "${output.action == 'back'}" }
          commands: [back]
      - runFlow:
          when: { true: "${output.action == 'longPress'}" }
          commands:
            - longPressOn: { point: '${output.point}' }
      # A native button (a dialog's, a menu item): it hides the screen behind it, so wait for it.
      - runFlow:
          when: { true: "${output.action == 'press'}" }
          commands:
            - extendedWaitUntil: { visible: '${output.text}', timeout: 30000 }
            - tapOn:
                { text: '${output.text}', retryTapIfNoChange: false, waitToSettleTimeoutMs: 200 }
      - runFlow:
          when: { true: "${output.action == 'kill'}" }
          commands:
            - runScript: scripts/kill.js
      # A kill with the app in the background: home, kill, and back 5 s later (/slow answers after ms).
      - runFlow:
          when: { true: "${output.action == 'killInBackground'}" }
          commands:
            - pressKey: Home
            - runScript: scripts/kill.js
            - evalScript: ${http.get(PAGES + '/slow?ms=5000')}
            - launchApp: { stopApp: false }
      - runFlow:
          when: { true: "${output.action == 'location'}" }
          commands:
            - setLocation: { latitude: 59.43, longitude: 24.75 }
      # A pull down the page. Full and inner pulls start at the top; short pulls scroll a little.
      - runFlow:
          when: { platform: iOS, true: "${output.action == 'swipe' && output.kind == 'full'}" }
          commands:
            [
              swipe:
                { start: '50%, 29%', end: '50%, 80%', duration: 900, waitToSettleTimeoutMs: 200 },
            ]
      - runFlow:
          when: { platform: iOS, true: "${output.action == 'swipe' && output.kind == 'short'}" }
          commands:
            [
              swipe:
                { start: '50%, 51%', end: '50%, 63%', duration: 400, waitToSettleTimeoutMs: 200 },
            ]
      - runFlow:
          when: { platform: iOS, true: "${output.action == 'swipe' && output.kind == 'inner'}" }
          commands:
            [
              swipe:
                { start: '50%, 34%', end: '50%, 86%', duration: 900, waitToSettleTimeoutMs: 200 },
            ]
      - runFlow:
          when: { platform: Android, true: "${output.action == 'swipe' && output.kind == 'full'}" }
          commands:
            [
              swipe:
                { start: '50%, 25%', end: '50%, 74%', duration: 500, waitToSettleTimeoutMs: 200 },
            ]
      - runFlow:
          when: { platform: Android, true: "${output.action == 'swipe' && output.kind == 'short'}" }
          commands:
            [
              swipe:
                { start: '50%, 42%', end: '50%, 53%', duration: 300, waitToSettleTimeoutMs: 200 },
            ]
      - runFlow:
          when: { platform: Android, true: "${output.action == 'swipe' && output.kind == 'inner'}" }
          commands:
            [
              swipe:
                { start: '50%, 32%', end: '50%, 74%', duration: 500, waitToSettleTimeoutMs: 200 },
            ]
- assertTrue: ${output.fail === 0}
