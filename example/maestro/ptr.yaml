appId: expo.modules.minimalwebview.example
name: ptr
env:
  SUITE: ptr
---
- runFlow: subflows/launch.yaml
- runFlow: { file: subflows/pull.yaml, env: { N: 1, KIND: full } }
- runFlow: { file: subflows/pull.yaml, env: { N: 2, KIND: full } }
- runFlow: { file: subflows/pull.yaml, env: { N: 3, KIND: short } }
- runFlow: { file: subflows/pull.yaml, env: { N: 4, KIND: inner } }
- runFlow: { file: subflows/pull.yaml, env: { N: 5, KIND: full } }
- runFlow: { file: subflows/pull.yaml, env: { N: 6, KIND: full } }
- runFlow: { file: subflows/pull.yaml, env: { N: 7, KIND: full } }
- runFlow: subflows/finish.yaml
