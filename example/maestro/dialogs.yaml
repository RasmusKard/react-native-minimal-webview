appId: expo.modules.minimalwebview.example
name: dialogs
env:
  SUITE: dialogs
---
# alert, confirm, prompt. Each press reads the screen only once the harness has asked for it, so the query lands while
# the dialog blocks the page (MinimalWebView.swift's `dialog` says why that matters). The dialog hides the screen
# behind it, so wait for its OK button.
- runFlow: subflows/launch.yaml
- runFlow: { file: subflows/await.yaml, env: { N: 1 } }
- extendedWaitUntil: { visible: OK, timeout: 30000 }
- tapOn: { text: OK, retryTapIfNoChange: false, waitToSettleTimeoutMs: 200 }
- runFlow: { file: subflows/await.yaml, env: { N: 2 } }
- extendedWaitUntil: { visible: OK, timeout: 30000 }
- tapOn: { text: OK, retryTapIfNoChange: false, waitToSettleTimeoutMs: 200 }
- runFlow: { file: subflows/await.yaml, env: { N: 3 } }
- extendedWaitUntil: { visible: OK, timeout: 30000 }
- tapOn: { text: OK, retryTapIfNoChange: false, waitToSettleTimeoutMs: 200 }
- runFlow: subflows/finish.yaml
