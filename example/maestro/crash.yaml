appId: expo.modules.minimalwebview.example
name: crash
env:
  SUITE: crash
---
# Twelve renderer kills; the harness asks for each once the page answers an evaluate (a live renderer).
- runFlow: subflows/launch.yaml
- repeat:
    times: 11
    commands:
      - evalScript: ${output.n = (output.n || 0) + 1}
      - runFlow: { file: subflows/await.yaml, env: { N: '${output.n}' } }
      - runScript: scripts/kill.js
# The 12th with the app in the background: home, kill, and back 5 s later (/slow answers after ms).
- evalScript: ${output.n = output.n + 1}
- runFlow: { file: subflows/await.yaml, env: { N: '${output.n}' } }
- pressKey: Home
- runScript: scripts/kill.js
- evalScript: ${http.get('http://localhost:8090/slow?ms=5000')}
- launchApp: { stopApp: false }
- runFlow: subflows/finish.yaml
