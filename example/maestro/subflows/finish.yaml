appId: expo.modules.minimalwebview.example
---
# Waits for the harness's verdict, then fails the flow unless every check passed.
- extendedWaitUntil: { visible: { id: harness-request, text: '${SUITE}#done .*' }, timeout: 280000 }
- assertVisible: { id: harness-request, text: '${SUITE}#done pass=\d+ fail=0' }
