appId: expo.modules.minimalwebview.example
---
# Reuses the running app when the test server's /harness/idle answers yes (the harness resets itself after each suite,
# pollForSuites); otherwise launches it fresh.
- runScript: ../scripts/idle.js
- runFlow:
    when: { true: '${output.launch}' }
    commands:
      - launchApp: { stopApp: true, permissions: { all: allow } }
- runScript: ../scripts/start.js
