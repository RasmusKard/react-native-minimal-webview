# Anti-slop profile: hygiene rules only, no style. Baseline: .claude/baseline/swiftlint.json
included: [ios]
only_rules:
  - cyclomatic_complexity
  - function_body_length
  - function_parameter_count
  - force_cast
  - force_try
  - force_unwrapping
  - todo
  - no_empty_block
  - unneeded_override
  - unneeded_synthesized_initializer
  - unneeded_throws_rethrows
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_optional_binding
  - unused_setter_value
  - unhandled_throwing_task
  - redundant_nil_coalescing
  - redundant_discardable_let
  - redundant_void_return
  - no_fallthrough_only
  - superfluous_disable_command
  - blanket_disable_command
  - invalid_swiftlint_command
cyclomatic_complexity: { warning: 15, error: 15, ignores_case_statements: false }
function_body_length: { warning: 120, error: 400 }  # warn only below the error level: .claude/check reports errors only
function_parameter_count: { warning: 6, error: 12 }
todo: { severity: error }
no_empty_block: { severity: error }
force_unwrapping: { severity: error }
