version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    groups:
      actions: { patterns: ['*'] }
  # Expo's packages, React and React Native move as one set, in the root and in example/ at once, with
  # `expo install --fix` (workflows/expo-packages.yml): each Expo package's precompiled iOS framework is built against one
  # version of the others, and one bumped alone crashes the app at launch. Majors held until what blocks them moves:
  # TypeScript 7 (typedoc and typescript-eslint stop at 6.0), ESLint 10 (eslint-plugin-react, in eslint-config-universe,
  # calls APIs it removed), Babel 8 (babel-preset-expo is on 7) and @types/node (.nvmrc's Node 22).
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ['*'] }
    ignore:
      - dependency-name: expo
      - dependency-name: jest-expo
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@babel/core'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /example
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ['*'] }
    ignore:
      - dependency-name: expo
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: typescript
        update-types: [version-update:semver-major]
