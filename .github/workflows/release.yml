name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Holds the App key; limited to main.
    environment:
      name: release
      # This job runs on every push; only publish is a deployment.
      deployment: false
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      paths: ${{ steps.release.outputs.paths_released }}
      core-tag: ${{ steps.release.outputs.tag_name }}
      extensions-tag: ${{ steps.release.outputs['extensions--tag_name'] }}
    steps:
      # A PR opened with GITHUB_TOKEN would not trigger CI on the release PR.
      - id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE: ${{ matrix.path }}
      TAG: ${{ matrix.path == '.' && needs.release-please.outputs.core-tag || needs.release-please.outputs.extensions-tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          # A cache written by other workflows could poison the release.
          package-manager-cache: false
      - run: test "${TAG##*-v}" = "$(node -p "require('./$PACKAGE/package.json').version")"
      - run: npm ci --ignore-scripts && (cd example && npm ci --ignore-scripts)
      - run: npm run check
      - run: npm pack --ignore-scripts "./$PACKAGE"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}
          path: react-native-minimal-webview-*.tgz

  # Holds the OIDC token, so it runs no repository or dependency code.
  attest:
    needs: [release-please, build]
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    env:
      TAG: ${{ matrix.path == '.' && needs.release-please.outputs.core-tag || needs.release-please.outputs.extensions-tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.TAG }}
      - uses: actions/attest@v4.2.2
        with:
          subject-path: react-native-minimal-webview-*.tgz
      - run: gh release upload "$TAG" react-native-minimal-webview-*.tgz -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # Holds the npm OIDC token, so it runs no repository or dependency code.
  publish:
    needs: [release-please, attest]
    runs-on: ubuntu-latest
    # npm's trusted publisher entries name this environment.
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later.
          node-version: 24
          package-manager-cache: false
      # By name, so each tarball lands in its tag's folder: downloading all puts a lone artifact in the workspace root.
      - if: needs.release-please.outputs.core-tag
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.release-please.outputs.core-tag }}
          path: ${{ needs.release-please.outputs.core-tag }}
      - if: needs.release-please.outputs.extensions-tag
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.release-please.outputs.extensions-tag }}
          path: ${{ needs.release-please.outputs.extensions-tag }}
      # The core goes first: the extensions package takes it as a peer. Only a core release is "Latest", since the docs
      # site shows that release's tag as the version. A tarball runs no lifecycle scripts.
      # The ./ keeps npm from reading <tag>/<file>.tgz as a GitHub owner/repo.
      - run: |
          for tag in $CORE_TAG $EXTENSIONS_TAG; do
            tarball=$(echo ./"$tag"/*.tgz)
            spec=$(tar -xOzf "$tarball" package/package.json | jq -er '.name + "@" + .version')
            npm view "$spec" version > /dev/null 2>&1 || npm publish "$tarball"
            gh release edit "$tag" --draft=false --latest="$([ "$tag" = "$CORE_TAG" ] && echo true || echo false)" \
              -R "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TAG: ${{ needs.release-please.outputs.core-tag }}
          EXTENSIONS_TAG: ${{ needs.release-please.outputs.extensions-tag }}
