name: Expo packages

# Dependabot can't run `expo install`, and Expo's packages, React and React Native only work as the set Expo names
# (dependabot.yml ignores them).
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: expo-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Holds the App key; limited to main.
    environment: release
    env:
      BRANCH: deps/expo-packages
      TITLE: 'chore: Update the Expo packages of the root and the example app'
    steps:
      # A PR opened with GITHUB_TOKEN would not trigger CI.
      - id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7.0.1
        with: { token: '${{ steps.app-token.outputs.token }}' }
      - uses: pnpm/setup@v3.2.0
        with: { install: false }
      - run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec expo install --fix -- --workspace-root --ignore-scripts
          (cd example && pnpm exec expo install --fix -- --ignore-scripts)
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git commit -am "$TITLE"
          git push --force origin "$BRANCH"
          [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != 0 ] ||
            gh pr create --head "$BRANCH" --title "$TITLE" \
              --body 'What `pnpm exec expo install --fix` changes in the root and in `example/`.'
