name: kotlin
on:
  pull_request:
  # Only to save what every PR starts from (a PR's own caches stay with that PR): the Gradle cache and the result.
  push:
    branches: [main]

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The key covers what the tests and the compile read, and the entry is saved only when the job passes: on a hit,
      # they have passed before, and the job runs nothing.
      - id: passed
        uses: actions/cache@v6.1.0
        with:
          path: .passed
          key: >-
            kotlin-tests-${{ hashFiles('android/**', 'extensions/**', 'example/modules/**', 'example/*.json',
            'src/__tests__/vectors/**', 'expo-module.config.json', 'package.json', '.github/workflows/kotlin.yml') }}
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6.3.0
        with: { distribution: zulu, java-version: 17 }
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6.4.1
        with: { cache-read-only: false }
      - if: steps.passed.outputs.cache-hit != 'true'
        run: |
          npm ci && (cd example && npm ci && npx expo prebuild --platform android --no-install)
          cd example/android && ./gradlew :react-native-minimal-webview:testDebugUnitTest \
            :react-native-minimal-webview-extensions:compileDebugKotlin :sample-extension:compileDebugKotlin
          touch ../../.passed
