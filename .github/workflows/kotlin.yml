name: kotlin
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  # Only to refresh the Gradle cache that every PR starts from (a PR's own cache stays with that PR), so only when the
  # dependencies change. An older main cache still saves most of the downloads.
  push:
    branches: [main]
    paths:
      - package-lock.json
      - example/package-lock.json
      - android/build.gradle
      - example/modules/sample-extension/android/build.gradle
      - .github/workflows/kotlin.yml

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Kotlin unit tests, the navigation rule matcher among them against the shared cases in src/__tests__/vectors/.
  # There is no Kotlin origin matcher: Android matches origins itself (addWebMessageListener).
  kotlin-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: zulu, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
        with: { cache-read-only: false }
      - run: npm ci && (cd example && npm ci)
      - run: cd example && npx expo prebuild --platform android --no-install
      - run: cd example/android && ./gradlew :minimal-rn-webview:testDebugUnitTest
