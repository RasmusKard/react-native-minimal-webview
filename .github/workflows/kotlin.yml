name: kotlin
on:
  pull_request:
  # Only to refresh the Gradle cache that every PR starts from (a PR's own cache stays with that PR), so only when the
  # dependencies change. An older main cache still saves most of the downloads.
  push:
    branches: [main]
    paths:
      - package-lock.json
      - example/package-lock.json
      - android/build.gradle
      - extensions/build.gradle
      - example/modules/sample-extension/android/build.gradle
      - .github/workflows/kotlin.yml

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips `kotlin-tests` for a PR of only Markdown. A job, not a `paths-ignore` filter, so the required `kotlin-tests`
  # reports skipped (passing) instead of pending.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { pull-requests: read }
    outputs: { run: '${{ steps.files.outputs.run }}' }
    steps:
      - id: files
        env: { GH_TOKEN: '${{ github.token }}', PR: '${{ github.event.pull_request.number }}' }
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, .previous_filename // empty')
          if grep -qv '\.md$' <<<"$files"; then echo run=true >>"$GITHUB_OUTPUT"; else echo run=false >>"$GITHUB_OUTPUT"; fi

  kotlin-tests:
    needs: changes
    # A failed `changes` still runs the tests, and so does `push`, which skips `changes`.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-java@v6.3.0
        with: { distribution: zulu, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6.4.1
        with: { cache-read-only: false }
      - run: npm ci && (cd example && npm ci)
      - run: cd example && npx expo prebuild --platform android --no-install
      - run: >-
          cd example/android && ./gradlew :react-native-minimal-webview:testDebugUnitTest
          :react-native-minimal-webview-extensions:compileDebugKotlin :sample-extension:compileDebugKotlin
