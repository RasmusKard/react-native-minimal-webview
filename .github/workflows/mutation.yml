name: mutation
on:
  pull_request:
    paths: ['src/bridge/**', 'src/WebView.tsx', 'src/refStore.ts', 'src/__tests__/**', '.config/stryker.config.json']

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stryker on the files .config/stryker.config.json lists; fails below a mutation score of 80.
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run mutation
