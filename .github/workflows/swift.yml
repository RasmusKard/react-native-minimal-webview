name: swift
on:
  pull_request:
    paths: ['ios/**', 'src/__tests__/vectors/**', '.github/workflows/swift.yml']

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Swift tests: the navigation and origin rule matchers and crash recovery against the shared cases in
  # src/__tests__/vectors/, the ask, delegate proxy and read root cases, and the PlatformSettings tests as Mac Catalyst.
  # macOS: DelegateProxy.swift needs WebKit.
  swift-rules:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ios/Tests/run.sh
