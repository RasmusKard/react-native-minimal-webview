name: swift
on:
  pull_request:
    paths: ['ios/**', 'src/__tests__/vectors/**', '.github/workflows/swift.yml']

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS: DelegateProxy.swift needs WebKit.
  swift-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ios/Tests/run.sh
