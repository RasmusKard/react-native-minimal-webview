name: swift
on:
  pull_request:
    paths: ['ios/**', 'src/__tests__/vectors/**', '.github/workflows/swift.yml']

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Swift tests (ios/Tests/main.swift says what they cover) and the PlatformSettings tests as Mac Catalyst.
  # macOS: DelegateProxy.swift needs WebKit.
  swift-rules:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ios/Tests/run.sh
