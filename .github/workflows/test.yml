name: test
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p src/__tests__/tsconfig.json
      - run: cd example && npm ci && npx tsc --noEmit
      - run: npm test -- --watchAll=false   # its pretest checks the generated files
      - run: npm run prepare   # clean build

  # The Swift navigation and origin rule matchers and crash recovery against the shared cases in
  # src/__tests__/vectors/, and the DocumentScope and ask cases. Linux, not macOS: the files need only Foundation, and
  # macOS minutes cost 10x.
  swift-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          swiftc ios/NavigationRules.swift ios/OriginRules.swift ios/DocumentScope.swift ios/Asks.swift
          ios/Recovery.swift ios/ReadAccess.swift ios/Tests/main.swift -o rules && ./rules

  # iOS native code is built only locally (macOS minutes cost 10x), along with the on-device suites
  # (example/harness.ts), which need an emulator and a simulator: see .github/CONTRIBUTING.md.
