name: test
on:
  pull_request:
    # Of the Markdown, only the pages whose samples .github/scripts/check-doc-samples.mts type-checks
    paths: ['**', '!**.md', '!docs/**', 'README.md', 'extensions/README.md', 'guides/*.md']

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `npm run check`, as .github/CONTRIBUTING.md runs it locally.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci && (cd example && npm ci) && npm run check

  # The on-device suites (example/harness.ts) need an emulator and a simulator, so they run locally: see
  # .github/CONTRIBUTING.md.
