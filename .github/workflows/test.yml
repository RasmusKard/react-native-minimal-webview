name: test
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions: { contents: read }

concurrency:   # a new push cancels the run for the previous one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p src/__tests__/tsconfig.json
      - run: cd example && npm ci && npx tsc --noEmit
      - run: node .github/scripts/build-page-client.mjs --check
      - run: npm run gen:platform-types -- --check   # src/platform.generated.ts matches the vendored SDK extracts
      - run: npm test -- --watchAll=false
      - run: npm run prepare   # clean build

  # The Swift navigation and origin rule matchers against the shared cases in src/__tests__/vectors/, and the
  # DocumentScope dispatch cases. Linux, not macOS: the three files need only Foundation, and macOS minutes cost 10x.
  swift-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          swiftc ios/NavigationRules.swift ios/OriginRules.swift ios/DocumentScope.swift ios/Tests/main.swift -o rules
          && ./rules

  # iOS native code is built only locally (macOS minutes cost 10x), along with the on-device suites
  # (example/harness.ts), which need an emulator and a simulator: see docs/development.md.
