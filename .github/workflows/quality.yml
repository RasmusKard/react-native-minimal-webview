name: quality
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions: { contents: read }

concurrency:   # a new push cancels the run for the previous one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx knip   # all but example/ (no baseline): unused files, exports, dependencies, unresolved imports
      - run: npm run lint
