name: quality
on: pull_request

concurrency:   # a new push cancels the run for the previous one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: dependency-cruiser (import cycles, unresolvable and undeclared imports, orphans)
        run: npx depcruise --config .dependency-cruiser.cjs src
      - run: npx knip   # whole repo (no baseline): unused files, exports, dependencies
      - run: npm run lint:ci
      - run: npm run mutation
