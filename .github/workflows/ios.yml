name: ios
on:
  pull_request:
  # Only to save the result that every PR starts from (a PR's own cache stays with that PR).
  push:
    branches: [main]

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Expo's packages ship precompiled iOS frameworks, which dyld links at launch: a set whose versions don't match builds,
  # and only fails to start.
  ios-launch:
    runs-on: macos-latest
    env:
      APP: expo.modules.minimalwebview.example
    steps:
      - uses: actions/checkout@v7.0.1
      - id: runner
        run: |
          echo "image=$ImageOS-$ImageVersion-xcode$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - id: launched
        uses: actions/cache@v6.1.0
        with:
          path: .launched
          key: >-
            ios-launch-${{ steps.runner.outputs.image }}-${{ hashFiles('ios/**', 'extensions/**', 'example/modules/**',
            'example/*.json', 'example/assets/**', 'expo-module.config.json', 'package.json', 'pnpm-lock.yaml',
            'pnpm-workspace.yaml', '.nvmrc', '.github/workflows/ios.yml') }}
      - if: steps.launched.outputs.cache-hit != 'true'
        uses: pnpm/setup@v3.2.0
        with: { install: false, cache: true }
      - if: steps.launched.outputs.cache-hit != 'true'
        run: |
          pnpm install --frozen-lockfile
          # expo run's own launch can time out on a simulator that is still starting: the launch below decides.
          (cd example && pnpm exec expo run:ios --no-bundler) || true
          xcrun simctl bootstatus booted
          pid=$(xcrun simctl launch --terminate-running-process booted "$APP" | awk '{ print $2 }')
          sleep 15
          kill -0 "$pid" || { grep -ho '"reasons":[^]]*' ~/Library/Logs/DiagnosticReports/*.ips; exit 1; }
          touch .launched
